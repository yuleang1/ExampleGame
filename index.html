<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      body {
        margin: 0;
        background-color: black;
      }
      div{
        position: fixed;
        color:white;
        font-weight: smaller;
        padding:5px;
      }
      
      .score-container{
        background-color: white;
        width:50%;
        top:50%;
        left:50%;
        transform: translate(-50%,-50%);
        text-align: center;
      }

      .score-container h1,
      .score-container p{
        color:black;
        margin: 0;
      }

      .score-container p{
        margin-bottom: 20px;
      }
      .score-container h1{
        margin-top: 12px;
      }
      

      .score-container button{
        padding:12px;
        background-color: rgb(134, 134, 241);
        border:none;
        border-radius: 50px;
        width:90%;
      }
      button:hover{
        opacity: 0.8;
      }
      button:active{
        opacity: 0.4;
      }
    </style>
  </head>
  <body>
    <div>
      <span>Score:</span>
      <span id="score">0</span>
    </div>

    <div class="score-container modalEle">
      <h1 class="bigScore">0</h1>
      <p >point</p>
      <button class="start">Start Game</button>
    </div>

    <canvas></canvas>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
